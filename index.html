<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S7 Scripte :: Supabase Real Auth</title>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #05020a; color: #c9d1d9; font-size: 14px; }

        header { 
            background-color: #0c0618; border-bottom: 1px solid #2e1065; 
            padding: 12px 20px; display: flex; justify-content: space-between; 
            align-items: center; position: sticky; top: 0; z-index: 100; 
        }
        .logo { font-size: 20px; font-weight: 800; color: #fff; text-shadow: 0 0 10px #a855f7; cursor: pointer; }
        .header-actions { display: flex; align-items: center; gap: 10px; }

        .btn-neon {
            background: #a855f7; color: #fff; border: none; padding: 8px 14px;
            border-radius: 6px; font-weight: bold; cursor: pointer;
            box-shadow: 0 0 10px rgba(168, 85, 247, 0.4); transition: 0.3s; font-size: 13px;
        }
        .btn-neon:hover { background: #c084fc; }

        .btn-auth { background: #1e0938; color: #c084fc; border: 1px solid #3b0764; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 12px; }
        .btn-auth:hover { border-color: #a855f7; color: #fff; }

        .menu-btn { background: none; border: none; color: #c084fc; font-size: 22px; cursor: pointer; }

        .sidebar {
            position: fixed; top: 0; right: -260px; width: 250px; height: 100%;
            background: #0c0618; border-left: 1px solid #3b0764; z-index: 200;
            transition: 0.3s ease; padding: 20px;
        }
        .sidebar.active { right: 0; }
        .sidebar-close { background: none; border: none; color: #a855f7; font-size: 20px; float: left; cursor: pointer; }
        .sidebar-links { margin-top: 40px; display: flex; flex-direction: column; gap: 12px; }
        .sidebar-links a { color: #e2d9f3; text-decoration: none; font-size: 15px; font-weight: 600; padding: 10px; border-radius: 8px; cursor: pointer; }

        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.85); display: none; z-index: 150; }
        .overlay.active { display: block; }

        .login-modal {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: #0d051a; border: 1px solid #a855f7; border-radius: 12px;
            padding: 30px; width: 90%; max-width: 380px; text-align: center;
            z-index: 300; display: none; box-shadow: 0 0 25px rgba(168, 85, 247, 0.4);
        }
        .login-modal h2 { color: #fff; margin-bottom: 8px; }
        .login-modal p { color: #94a3b8; font-size: 12px; margin-bottom: 20px; }
        .social-btn {
            width: 100%; padding: 12px; margin-bottom: 12px; border-radius: 8px;
            border: 1px solid #3b0764; background: #05020a; color: #fff;
            display: flex; align-items: center; justify-content: center; gap: 10px;
            font-weight: bold; cursor: pointer; transition: 0.3s;
        }
        .social-btn:hover { border-color: #a855f7; background: #1e0938; }
        .social-btn img { width: 20px; height: 20px; }

        .container { max-width: 900px; margin: 25px auto; padding: 0 15px; }

        .search-container {
            max-width: 650px; margin: 0 auto 25px auto; display: flex; gap: 5px;
            background: #0d051a; border: 1px solid #3b0764; border-radius: 8px; padding: 4px;
        }
        .search-container input { flex: 1; background: transparent; border: none; padding: 10px 15px; color: #fff; outline: none; }

        .script-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 15px; }
        .script-card { background: #0c0618; border: 1px solid #2e1065; border-radius: 10px; overflow: hidden; transition: 0.3s; cursor: pointer; }
        .script-card:hover { border-color: #a855f7; transform: translateY(-3px); }
        .script-img { width: 100%; height: 140px; background-size: cover; background-position: center; position: relative; }
        .stats-badge { position: absolute; top: 10px; right: 10px; background: rgba(5,2,10,0.8); color: #c084fc; font-size: 11px; padding: 2px 6px; border-radius: 4px; }
        
        .script-body { padding: 12px; }
        .script-title { font-weight: bold; color: #fff; font-size: 14px; margin-bottom: 5px; }

        .detail-page { display: none; }
        .detail-card { background: #0d051a; border: 1px solid #2e1065; border-radius: 12px; padding: 20px; margin-bottom: 20px; }
        .detail-header { display: flex; gap: 20px; flex-wrap: wrap; }
        .detail-img { width: 100%; max-width: 320px; height: 180px; border-radius: 8px; background-size: cover; background-position: center; border: 1px solid #3b0764; }
        
        .code-container { background: #05020a; border: 1px solid #2e1065; border-radius: 8px; padding: 15px; margin-top: 15px; }
        .code-box { font-family: monospace; color: #a855f7; font-size: 12px; word-break: break-all; white-space: pre-wrap; }

        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; color: #fff; font-weight: 600; margin-bottom: 6px; font-size: 13px; }
        .form-control { width: 100%; background: #05020a; border: 1px solid #2e1065; border-radius: 6px; padding: 10px; color: #fff; outline: none; }

        footer { text-align: center; padding: 20px; color: #64748b; border-top: 1px solid #2e1065; margin-top: 40px; font-size: 12px; }
    </style>
</head>
<body>

    <div class="overlay" id="overlay" onclick="closeSidebar()"></div>

    <!-- Real Login Modal -->
    <div class="login-modal" id="loginModal">
        <h2>Real Login</h2>
        <p>Sign in using your Google or GitHub account</p>
        
        <button class="social-btn" onclick="loginWithProvider('google')">
            <img src="https://www.gstatic.com/images/branding/product/1x/gsa_512dp.png" alt="Google">
            Continue with Google
        </button>
        
        <button class="social-btn" onclick="loginWithProvider('github')">
            <img src="https://github.githubassets.com/favicons/favicon.png" alt="GitHub">
            Continue with GitHub
        </button>
    </div>

    <!-- Sidebar -->
    <div class="sidebar" id="sidebar">
        <button class="sidebar-close" onclick="closeSidebar()">✕</button>
        <div class="sidebar-links">
            <a onclick="showHome(); closeSidebar();">Home</a>
            <a onclick="showUpload(); closeSidebar();">Upload Script</a>
            <a onclick="copyApiUrl(); closeSidebar();">API</a>
        </div>
    </div>

    <!-- Header -->
    <header>
        <div class="logo" onclick="showHome()">S7 Scripte</div>
        <div class="header-actions">
            <div id="userProfile" style="display:none; align-items: center; gap: 8px;">
                <button class="btn-auth" onclick="showProfile()" id="profileName">Profile</button>
                <button class="btn-neon" onclick="logout()">Logout</button>
            </div>
            <button class="btn-neon" onclick="showUpload()">Upload</button>
            <button class="menu-btn" onclick="openSidebar()">☰</button>
        </div>
    </header>

    <div class="container">
        <!-- HOME PAGE -->
        <div id="homePage">
            <div class="search-container">
                <input type="text" id="searchInput" placeholder="Search scripts..." onkeyup="searchScripts()">
                <button class="btn-neon" onclick="searchScripts()">Search</button>
            </div>
            <div style="margin-bottom: 15px;"><h2 style="color: #fff;">All Community Scripts</h2></div>
            <div class="script-grid" id="scriptGrid"></div>
        </div>

        <!-- PROFILE PAGE -->
        <div id="profilePage" class="detail-page">
            <button class="btn-auth" onclick="showHome()" style="margin-bottom: 15px;">← Back to Home</button>
            <div class="detail-card">
                <h2 style="color: #fff;" id="profileTitle">User Profile</h2>
                <p style="color: #94a3b8; margin-top: 5px;">Your uploaded scripts:</p>
            </div>
            <div class="script-grid" id="userScriptGrid"></div>
        </div>

        <!-- DETAIL PAGE -->
        <div id="detailPage" class="detail-page">
            <button class="btn-auth" onclick="showHome()" style="margin-bottom: 15px;">← Back to Home</button>
            
            <div class="detail-card">
                <div class="detail-header">
                    <div class="detail-img" id="detailImg"></div>
                    <div style="flex:1;">
                        <h1 id="detailTitle" style="color: #fff; font-size: 22px;"></h1>
                        <div id="detailMeta" style="color: #94a3b8; font-size: 12px; margin: 8px 0;"></div>
                        <div style="display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap;">
                            <button class="btn-neon" onclick="copyScriptCode()">Copy Script</button>
                            <button class="btn-auth" onclick="rateCurrentScript()">Rate (+1 Star)</button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="detail-card">
                <h3 style="color:#fff; margin-bottom: 10px;">Features</h3>
                <p style="color:#94a3b8;" id="detailDesc"></p>
            </div>

            <div class="detail-card">
                <h3 style="color:#fff; margin-bottom: 10px;">Raw Script</h3>
                <div class="code-container"><div class="code-box" id="detailCode"></div></div>
            </div>
        </div>

        <!-- UPLOAD PAGE -->
        <div id="uploadPage" class="detail-page">
            <button class="btn-auth" onclick="showHome()" style="margin-bottom: 15px;">← Back to Home</button>
            <div class="detail-card">
                <h2 style="color:#fff; text-align: center; margin-bottom: 20px;">Upload Script</h2>
                <form onsubmit="handleUpload(event)">
                    <div class="form-group"><label>Title</label><input type="text" id="upTitle" class="form-control" required></div>
                    <div class="form-group"><label>Game ID</label><input type="text" id="upGameId" class="form-control"></div>
                    <div class="form-group"><label>Thumbnail URL</label><input type="text" id="upImageUrl" class="form-control" placeholder="https://..."></div>
                    <div class="form-group"><label>Features</label><textarea id="upFeatures" class="form-control" required></textarea></div>
                    <div class="form-group"><label>Script Code</label><textarea id="upCode" class="form-control" style="font-family: monospace;" required></textarea></div>
                    <button type="submit" class="btn-neon" style="width: 100%; padding: 10px;">Upload</button>
                </form>
            </div>
        </div>
    </div>

    <footer>Developed by <b>S7 Scripte</b> | All Rights Reserved</footer>

    <script>
        const SUPABASE_URL = 'https://omikpwffrqlxsyibsqgm.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_o6ZUmnG4l7LU5LKnFydUkw_3KM-wZ1Y';

        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentUser = null;
        let allScripts = [];
        let currentScript = null;

        async function initAuth() {
            const { data: { user } } = await _supabase.auth.getUser();
            currentUser = user;
            updateAuthUI();

            _supabase.auth.onAuthStateChange((event, session) => {
                currentUser = session?.user || null;
                updateAuthUI();
            });
        }

        function updateAuthUI() {
            if (currentUser) {
                document.getElementById('loginModal').style.display = 'none';
                document.getElementById('overlay').classList.remove('active');
                document.getElementById('userProfile').style.display = 'flex';
                document.getElementById('profileName').innerText = `Profile (${currentUser.user_metadata.full_name || currentUser.email.split('@')[0]})`;
            } else {
                document.getElementById('loginModal').style.display = 'block';
                document.getElementById('overlay').classList.add('active');
                document.getElementById('userProfile').style.display = 'none';
            }
        }

        // تم تحديث هذه الدالة لتحديد رابط تحويل الموقع المباشر
        async function loginWithProvider(provider) {
            await _supabase.auth.signInWithOAuth({
                provider: provider,
                options: { 
                    redirectTo: 'https://aljshjjj-afk.github.io/S7script/' 
                }
            });
        }

        async function logout() {
            await _supabase.auth.signOut();
            location.reload();
        }

        async function fetchScripts() {
            const { data, error } = await _supabase
                .from('scripts')
                .select('*')
                .order('created_at', { ascending: false });

            if (!error) {
                allScripts = data || [];
                renderScripts(allScripts, 'scriptGrid');
            }
        }

        function renderScripts(scripts, containerId) {
            const grid = document.getElementById(containerId);
            grid.innerHTML = '';
            if (!scripts.length) { grid.innerHTML = '<div style="color:#a855f7;">No scripts uploaded yet.</div>'; return; }

            scripts.forEach((s) => {
                grid.innerHTML += `
                    <div class="script-card" onclick="openScriptDetails('${s.id}')">
                        <div class="script-img" style="background-image: url('${s.thumbnail || 'https://via.placeholder.com/300x150'}');">
                            <span class="stats-badge">★ ${s.rating || 0} | 👁 ${s.views || 0}</span>
                        </div>
                        <div class="script-body">
                            <div class="script-title">${s.title}</div>
                            <p style="font-size: 11px; color: #64748b;">By: ${s.owner}</p>
                        </div>
                    </div>
                `;
            });
        }

        function searchScripts() {
            const q = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allScripts.filter(s => s.title.toLowerCase().includes(q) || s.features.toLowerCase().includes(q));
            renderScripts(filtered, 'scriptGrid');
        }

        async function openScriptDetails(id) {
            currentScript = allScripts.find(s => s.id === id);
            
            await _supabase.from('scripts').update({ views: (currentScript.views || 0) + 1 }).eq('id', id);

            document.getElementById('detailTitle').innerText = currentScript.title;
            document.getElementById('detailMeta').innerText = `Views: ${currentScript.views + 1} | Rating: ★ ${currentScript.rating} | Owner: ${currentScript.owner}`;
            document.getElementById('detailImg').style.backgroundImage = `url('${currentScript.thumbnail || 'https://via.placeholder.com/300x150'}')`;
            document.getElementById('detailDesc').innerText = currentScript.features;
            document.getElementById('detailCode').innerText = currentScript.script_code;

            hideAllPages();
            document.getElementById('detailPage').style.display = 'block';
        }

        async function rateCurrentScript() {
            if (!currentScript) return;
            const newRating = (currentScript.rating || 0) + 1;
            await _supabase.from('scripts').update({ rating: newRating }).eq('id', currentScript.id);
            alert('Rating added!');
            await fetchScripts();
            showHome();
        }

        async function handleUpload(e) {
            e.preventDefault();
            if (!currentUser) return;

            const newScript = {
                title: document.getElementById('upTitle').value,
                game_id: document.getElementById('upGameId').value || 'Universal',
                thumbnail: document.getElementById('upImageUrl').value || 'https://via.placeholder.com/300x150',
                features: document.getElementById('upFeatures').value,
                script_code: document.getElementById('upCode').value,
                owner: currentUser.user_metadata?.full_name || currentUser.email
            };

            const { error } = await _supabase.from('scripts').insert([newScript]);
            if (!error) {
                alert('Script published publicly!');
                e.target.reset();
                await fetchScripts();
                showHome();
            } else {
                alert('Error uploading script: ' + error.message);
            }
        }

        function openSidebar() { document.getElementById('sidebar').classList.add('active'); document.getElementById('overlay').classList.add('active'); }
        function closeSidebar() { document.getElementById('sidebar').classList.remove('active'); if(currentUser) document.getElementById('overlay').classList.remove('active'); }
        function showHome() { hideAllPages(); document.getElementById('homePage').style.display = 'block'; }
        function showUpload() { if(!currentUser) return; hideAllPages(); document.getElementById('uploadPage').style.display = 'block'; }
        function showProfile() { hideAllPages(); document.getElementById('profilePage').style.display = 'block'; renderScripts(allScripts.filter(s => s.owner === (currentUser.user_metadata?.full_name || currentUser.email)), 'userScriptGrid'); }
        function hideAllPages() { document.getElementById('homePage').style.display = 'none'; document.getElementById('detailPage').style.display = 'none'; document.getElementById('uploadPage').style.display = 'none'; document.getElementById('profilePage').style.display = 'none'; }
        function copyScriptCode() { navigator.clipboard.writeText(currentScript.script_code); alert('Script copied!'); }
        function copyApiUrl() { navigator.clipboard.writeText(`${SUPABASE_URL}/rest/v1/scripts?select=*`); alert('API URL Copied!'); }

        initAuth();
        fetchScripts();
    </script>
</body>
</html>
