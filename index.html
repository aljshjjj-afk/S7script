<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f7fbff">
<title>S7 Snow × ICE ❄️</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Changa:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap');
:root{--ink:#172333;--muted:#738398;--ice:#dff4ff;--blue:#82cfff;--line:rgba(122,164,196,.2);--glass:rgba(255,255,255,.74)}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;min-height:100vh;color:var(--ink);font-family:Changa,Inter,sans-serif;background:radial-gradient(ellipse at 12% 8%,#fff 0,transparent 34%),radial-gradient(ellipse at 88% 24%,#dff4ff 0,transparent 36%),linear-gradient(135deg,#f8fcff,#eaf6ff 55%,#f9fcff);overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.32;background-image:radial-gradient(#8bbbd9 .8px,transparent .8px);background-size:17px 17px;z-index:-1}
body:after{content:"";position:fixed;inset:-20%;pointer-events:none;z-index:1;opacity:.55;background:radial-gradient(ellipse at 15% 78%,rgba(255,255,255,.92),transparent 35%),radial-gradient(ellipse at 78% 20%,rgba(211,241,255,.8),transparent 38%),radial-gradient(ellipse at 55% 95%,rgba(255,255,255,.9),transparent 32%);filter:blur(35px);animation:iceGlow 18s ease-in-out infinite alternate}
@keyframes iceGlow{from{transform:translate3d(-2%,1%,0) scale(1)}to{transform:translate3d(2%,-2%,0) scale(1.08)}}
.fog{position:fixed;inset:-15%;z-index:9;pointer-events:none;overflow:hidden;opacity:.72}
.fog-layer{position:absolute;left:-35%;width:170%;height:42%;border-radius:50%;filter:blur(38px);background:radial-gradient(ellipse,rgba(255,255,255,.68) 0%,rgba(225,245,255,.35) 42%,transparent 72%);animation:fogDrift linear infinite}
.fog-layer.one{top:12%;animation-duration:44s}
.fog-layer.two{top:48%;height:35%;opacity:.72;animation-duration:58s;animation-direction:reverse}
.fog-layer.three{top:77%;height:34%;opacity:.8;animation-duration:51s}
@keyframes fogDrift{from{transform:translateX(-12%) translateY(0) scale(1)}50%{transform:translateX(12%) translateY(-4%) scale(1.13)}to{transform:translateX(-12%) translateY(0) scale(1)}}
.snowbank{position:fixed;bottom:-70px;left:-5%;width:110%;height:145px;z-index:2;pointer-events:none;background:radial-gradient(ellipse at 20% 100%,#fff 0 40%,transparent 72%),radial-gradient(ellipse at 75% 110%,#f4fbff 0 43%,transparent 75%);filter:blur(9px);opacity:.86}
.snow{position:fixed;inset:0;pointer-events:none;z-index:10;overflow:hidden}
.flake{position:absolute;top:-12vh;color:#fff;text-shadow:0 0 8px #80cfff,0 0 18px #fff;animation:fall linear infinite;opacity:.9}
@keyframes fall{to{transform:translate3d(var(--drift),115vh,0) rotate(540deg)}}
.flake{will-change:transform;filter:drop-shadow(0 0 5px rgba(110,190,245,.75))}
.flake.big{filter:blur(.25px) drop-shadow(0 0 8px rgba(255,255,255,.95))}
.wrap{width:min(920px,calc(100% - 30px));margin:42px auto 70px;position:relative;z-index:5}
.topbar{display:none}
.brand{display:flex;align-items:center;gap:8px}.dot{width:8px;height:8px;border-radius:50%;background:#7bcaff;box-shadow:0 0 14px #73c9ff}
.card{background:var(--glass);border:1px solid rgba(255,255,255,.95);border-radius:27px;box-shadow:0 24px 70px rgba(83,137,174,.13),inset 0 1px 0 #fff;backdrop-filter:blur(18px);overflow:hidden}
.banner{height:230px;position:relative;background:#dceefa;overflow:hidden}
.banner img{width:100%;height:100%;object-fit:cover;display:block}
.banner:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.02),rgba(19,57,82,.13))}
.banner-tag{display:none}
.profile{padding:0 34px 30px}
.identity{display:flex;align-items:end;gap:19px;margin-top:-58px;position:relative;z-index:2}
.avatar-wrap{width:116px;height:116px;border-radius:32px;padding:5px;background:linear-gradient(145deg,#fff,#8bd4ff);box-shadow:0 12px 30px #6baedc45;flex:none}
.avatar{width:100%;height:100%;border-radius:28px;object-fit:cover;border:3px solid #fff}
.nameblock{padding-bottom:8px;min-width:0}
.name{font:800 clamp(22px,4vw,32px) Inter,Changa,sans-serif;letter-spacing:-1.2px;margin:0;color:#182c40}
.name span{color:#62b8ed}.handle{direction:ltr;text-align:right;color:#7b91a5;font:600 13px Inter;margin-top:7px}
.status{display:inline-flex;align-items:center;gap:7px;margin-top:11px;padding:6px 11px;border-radius:30px;background:#e8f6ff;color:#5486a8;font:700 10px Inter;letter-spacing:1px}
.status i{width:7px;height:7px;border-radius:50%;background:#69c99c;box-shadow:0 0 8px #69c99c}
.actions{display:flex;gap:9px;margin-right:auto;padding-bottom:9px}
.action{border:1px solid var(--line);background:#fff;color:#52718b;padding:10px 13px;border-radius:13px;text-decoration:none;font:700 11px Inter;cursor:pointer;transition:.2s}
.action:hover{transform:translateY(-3px);box-shadow:0 8px 20px #8bc9ef30}
.bio{margin-top:28px;padding:20px 22px;border:1px solid var(--line);border-radius:19px;background:linear-gradient(120deg,#ffffffc9,#f1f9ffb8)}
.section-title{font:800 11px Inter,sans-serif;letter-spacing:2px;color:#85a1b8;margin:0 0 14px;direction:ltr;text-align:left}
.bio-line{font-size:14px;color:#435a70;line-height:2.15}
.bio-line strong{color:#1d3b54;font-weight:800}
.spoiler{display:inline-block;direction:ltr;background:#dce8f1;color:transparent;text-shadow:0 0 7px #536b80;filter:blur(3px);border-radius:5px;padding:0 7px;cursor:pointer;transition:.18s;user-select:none}
.spoiler.reveal{color:#31536e;text-shadow:none;filter:none;background:#e3f4ff}
.badges{margin-top:26px}
.badge-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}
.badge{aspect-ratio:1.05;display:flex;align-items:center;justify-content:center;border-radius:20px;background:#f0faff;border:1px solid #e8f6ff;box-shadow:inset 0 1px 0 #fff,0 8px 22px rgba(91,142,176,.08);transition:.22s;position:relative;overflow:hidden;padding:22px}
.badge svg{width:min(72%,92px);height:auto;filter:drop-shadow(0 3px 3px rgba(60,100,130,.12))}
.badge:after{content:"";position:absolute;inset:0;background:linear-gradient(135deg,#fff7,transparent 55%);pointer-events:none}
.badge:hover{transform:translateY(-5px) scale(1.025);box-shadow:0 14px 28px #80bde333}
.badge small{position:absolute;bottom:9px;font:700 8px Inter;letter-spacing:1px;color:#94aabd}
.accounts{display:grid;grid-template-columns:1fr 1fr;gap:13px;margin-top:25px}
.account{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;background:#ffffffb8;border:1px solid #fff;border-radius:17px}
.account-label{font:700 9px Inter;letter-spacing:1.4px;color:#91a8ba}
.account-user{direction:ltr;font:800 17px Inter;color:#31536e;margin-top:5px}
.copy{border:0;background:#e7f5ff;color:#5d9bc5;border-radius:11px;width:37px;height:37px;font-size:17px;cursor:pointer}
.footer{text-align:center;color:#9bb0c1;font:600 10px Inter;letter-spacing:2px;margin-top:23px}
.sound-toggle{position:fixed;left:18px;bottom:18px;z-index:15;border:1px solid #d9efff;background:#ffffffdf;color:#5486a8;border-radius:30px;padding:10px 15px;font:700 11px Inter;box-shadow:0 8px 25px #76b9e52b;backdrop-filter:blur(12px);cursor:pointer}
.sound-toggle:hover{transform:translateY(-2px)}
.toast{position:fixed;bottom:25px;left:50%;transform:translate(-50%,20px);opacity:0;background:#203d55;color:white;padding:10px 17px;border-radius:30px;font:600 12px Inter;transition:.25s;z-index:20;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:650px){.wrap{margin:20px auto 45px}.banner{height:170px}.profile{padding:0 18px 23px}.identity{gap:12px;flex-wrap:wrap}.avatar-wrap{width:91px;height:91px;border-radius:25px;margin-top:8px}.avatar{border-radius:21px}.name{font-size:21px}.actions{width:100%;margin:2px 0 0;padding:0}.action{flex:1;text-align:center}.badge-grid{grid-template-columns:repeat(2,1fr);gap:10px}.badge{aspect-ratio:1.35;font-size:39px}.accounts{grid-template-columns:1fr}.bio{padding:16px}.topbar{font-size:10px}}
</style>
</head>

<div class="toast" id="toast">Copied ✓</div>
<script>
const snow=document.getElementById('snow');
const audio=document.getElementById('introAudio');
const soundToggle=document.getElementById('soundToggle');
audio.volume=0.45;
function updateSoundButton(){soundToggle.innerHTML=audio.paused?'♫ <span>تشغيل الصوت</span>':'♫ <span>إيقاف الصوت</span>';}
let audioUnlocked=false;
async function startAudio(){
 try{
  audio.muted=false;
  await audio.play();
  audioUnlocked=true;
  updateSoundButton();
  document.removeEventListener('pointerdown',firstTouch,true);
  document.removeEventListener('keydown',firstTouch,true);
 }catch(e){updateSoundButton();}
}
function firstTouch(){startAudio();}
soundToggle.addEventListener('click',async()=>{if(audio.paused){await startAudio();}else{audio.pause();updateSoundButton();}});
window.addEventListener('load',()=>{
 startAudio();
 // If autoplay is blocked, start the music immediately on the visitor's first tap/click/key.
 document.addEventListener('pointerdown',firstTouch,true);
 document.addEventListener('keydown',firstTouch,true);
});
for(let i=0;i<145;i++){
 const f=document.createElement('span');f.className='flake'+(Math.random()>.78?' big':'');
 const kind=Math.random();
 f.textContent=kind>.76?'❅':kind>.42?'❄':'✧';
 f.style.left=Math.random()*100+'%';
 f.style.fontSize=(5+Math.pow(Math.random(),1.8)*19)+'px';
 f.style.animationDuration=(8+Math.random()*19)+'s';
 f.style.animationDelay=(-Math.random()*27)+'s';
 f.style.setProperty('--drift',(Math.random()*230-115)+'px');
 f.style.opacity=.22+Math.random()*.72;
 if(Math.random()>.72) f.style.filter='blur(1.2px) drop-shadow(0 0 5px #fff)';
 snow.appendChild(f);
}
function copyText(value){
 if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(value).then(showToast).catch(()=>fallback(value));}
 else fallback(value);
}
function fallback(value){const t=document.createElement('textarea');t.value=value;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove();showToast();}
function showToast(){const t=document.getElementById('toast');t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1600);}
</script>
