<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>S7 SERVER - تحت الصيانة</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>

@import url('https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600;700;800&display=swap');

*{
    box-sizing:border-box;
    font-family: 'Readex Pro', sans-serif;
}

body{
    margin:0;
    min-height:100vh;
    color:#ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
    background: url("https://cdn.discordapp.com/attachments/1556721207519485993/1556728929086083082/d895c222e5fe92cb334de04e6d8f6828.gif?backend=b2&ex=6ac5384b&is=6ac3e6cb&hm=b272e7c94ef50dc9e8ba21891d865fcb3ce192d15e0c81f2729929760e14ee39&") no-repeat center center fixed;
    background-size: cover;
}

body::before {
    content: "";
    position: fixed;
    inset: 0;
    background: rgba(15, 23, 42, 0.65);
    pointer-events: none;
    z-index: -1;
}

.maintenance-card {
    width: min(480px, 90%);
    background: rgba(255, 255, 255, 0.1);
    border: 1px solid rgba(255, 255, 255, 0.22);
    backdrop-filter: blur(30px) saturate(190%);
    -webkit-backdrop-filter: blur(30px) saturate(190%);
    border-radius: 32px;
    padding: 40px 30px;
    text-align: center;
    box-shadow: 0 25px 50px rgba(0, 0, 0, 0.4), inset 0 1px 2px rgba(255, 255, 255, 0.3);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
}

.brand-logo {
    width: 80px;
    height: 80px;
    border-radius: 22px;
    object-fit: cover;
    border: 2px solid rgba(255, 255, 255, 0.5);
    box-shadow: 0 10px 25px rgba(239, 68, 68, 0.4);
}

.brand-name {
    font-size: 28px;
    font-weight: 800;
    color: #ffffff;
    letter-spacing: -0.5px;
}

.brand-name span {
    color: #ef4444;
    text-shadow: 0 2px 12px rgba(239, 68, 68, 0.5);
}

.maintenance-title {
    font-size: 22px;
    font-weight: 800;
    color: #f87171;
    margin-top: 5px;
}

.maintenance-desc {
    font-size: 15px;
    color: rgba(255, 255, 255, 0.8);
    font-weight: 600;
    line-height: 1.6;
}

.geom-shape {
    width: 14px;
    height: 14px;
    border: 2px solid #ef4444;
    background: #ef4444;
    border-radius: 50%;
    box-shadow: 0 0 10px #ef4444;
    animation: pulse 2s infinite;
}

@keyframes pulse {
    0% { transform: scale(0.95); opacity: 0.8; }
    50% { transform: scale(1.15); opacity: 1; }
    100% { transform: scale(0.95); opacity: 0.8; }
}

.footer {
    position: absolute;
    bottom: 20px;
    color: rgba(255, 255, 255, 0.5);
    font-size: 13px;
    font-weight: 600;
}

</style>

</head>

<body>

<div class="maintenance-card">
    <img class="brand-logo" src="https://cdn.discordapp.com/attachments/1556721207519485993/1556729111962193990/Screenshot_2026-09-27-15-08-26-897_com.lemon.lvoverseas-edit-1-1.jpg?backend=b2&ex=6ac53876&is=6ac3e6f6&hm=00852f7f1b8fe6c94408d1fc5cd58b47dfd893c87c05a9f8a80f802e341c0397&" alt="S7 Logo">
    
    <div class="brand-name">S7 <span>SERVER</span></div>
    
    <div class="geom-shape"></div>
    
    <div class="maintenance-title">الموقع تحت الصيانة حالياً</div>
    
    <div class="maintenance-desc">
        نعمل على تحديث وتطوير السيرفر وإضافة مميزات جديدة لتقديم أفضل تجربة لكم. يرجى العودة قريباً!
    </div>
</div>

<div class="footer">
    S7 SERVER © 2026 - All Rights Reserved
</div>

</body>
</html>
