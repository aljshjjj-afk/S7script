<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OMNEX :: صيانة</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: #000; 
            color: #fff; 
            font-family: sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            overflow: hidden;
        }
        .story-container {
            width: 360px; 
            height: 85vh; 
            background: #0a0a0a;
            border-radius: 20px;
            box-shadow: 0 0 25px rgba(18, 255, 255, 0.4);
            border: 2px solid #12ffff;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        h1 {
            font-size: 3rem;
            color: #fff;
            text-shadow: 0 0 10px #fff, 0 0 20px #12ffff, 0 0 40px #12ffff;
            margin-bottom: 40px;
            letter-spacing: 2px;
        }
        .status {
            font-size: 1.3rem;
            color: #ff0055;
            text-shadow: 0 0 12px #ff0055;
            letter-spacing: 3px;
        }
        .loader {
            width: 180px;
            height: 4px;
            background: rgba(255,0,85,0.2);
            margin-top: 15px;
            position: relative;
            border-radius: 5px;
            overflow: hidden;
        }
        .loader::after {
            content: '';
            position: absolute;
            left: 0; top: 0; height: 100%; width: 50%;
            background: #ff0055;
            box-shadow: 0 0 10px #ff0055;
            animation: moveLoader 1.5s infinite linear;
        }
        @keyframes moveLoader {
            0% { left: -50%; }
            100% { left: 100%; }
        }
        .footer-text {
            position: absolute;
            bottom: 25px;
            font-size: 0.75rem;
            color: #444;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>
    <div class="story-container">
        <h1>OMNEX</h1>
        <div class="status">تحت الصيانة</div>
        <div class="loader"></div>
        <div class="footer-text">SYSTEM_STATUS: OFFLINE</div>
    </div>
</body>
</html>
