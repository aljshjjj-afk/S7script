<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S7 Scripte :: Neon Hub</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #05020a; color: #c9d1d9; font-size: 14px; }

        header { 
            background-color: #0c0618; border-bottom: 1px solid #2e1065; 
            padding: 12px 20px; display: flex; justify-content: space-between; 
            align-items: center; position: sticky; top: 0; z-index: 100; 
        }
        .logo { font-size: 20px; font-weight: 800; color: #fff; text-shadow: 0 0 10px #a855f7; cursor: pointer; }
        .header-actions { display: flex; align-items: center; gap: 10px; }

        .btn-neon {
            background: #a855f7; color: #fff; border: none; padding: 8px 14px;
            border-radius: 6px; font-weight: bold; cursor: pointer;
            box-shadow: 0 0 10px rgba(168, 85, 247, 0.4); transition: 0.3s; font-size: 13px;
        }
        .btn-neon:hover { background: #c084fc; }

        .btn-auth { background: #1e0938; color: #c084fc; border: 1px solid #3b0764; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 12px; }
        .btn-auth:hover { border-color: #a855f7; color: #fff; }

        .menu-btn { background: none; border: none; color: #c084fc; font-size: 22px; cursor: pointer; }

        .sidebar {
            position: fixed; top: 0; right: -260px; width: 250px; height: 100%;
            background: #0c0618; border-left: 1px solid #3b0764; z-index: 200;
            transition: 0.3s ease; padding: 20px;
        }
        .sidebar.active { right: 0; }
        .sidebar-close { background: none; border: none; color: #a855f7; font-size: 20px; float: left; cursor: pointer; }
        .sidebar-links { margin-top: 40px; display: flex; flex-direction: column; gap: 12px; }
        .sidebar-links a { color: #e2d9f3; text-decoration: none; font-size: 15px; font-weight: 600; padding: 10px; border-radius: 8px; cursor: pointer; }

        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.8); display: none; z-index: 150; }
        .overlay.active { display: block; }

        /* Login Modal Window */
        .login-modal {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: #0d051a; border: 1px solid #a855f7; border-radius: 12px;
            padding: 30px; width: 90%; max-width: 380px; text-align: center;
            z-index: 300; display: none; box-shadow: 0 0 20px rgba(168, 85, 247, 0.3);
        }
        .login-modal h2 { color: #fff; margin-bottom: 8px; }
        .login-modal p { color: #94a3b8; font-size: 12px; margin-bottom: 20px; }
        .social-btn {
            width: 100%; padding: 10px; margin-bottom: 12px; border-radius: 8px;
            border: 1px solid #3b0764; background: #05020a; color: #fff;
            display: flex; align-items: center; justify-content: center; gap: 10px;
            font-weight: bold; cursor: pointer; transition: 0.3s;
        }
        .social-btn:hover { border-color: #a855f7; background: #1e0938; }
        .social-btn img { width: 20px; height: 20px; }

        .container { max-width: 900px; margin: 25px auto; padding: 0 15px; }

        .search-container {
            max-width: 650px; margin: 0 auto 25px auto; display: flex; gap: 5px;
            background: #0d051a; border: 1px solid #3b0764; border-radius: 8px; padding: 4px;
        }
        .search-container input { flex: 1; background: transparent; border: none; padding: 10px 15px; color: #fff; outline: none; }

        .script-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 15px; }
        .script-card { background: #0c0618; border: 1px solid #2e1065; border-radius: 10px; overflow: hidden; transition: 0.3s; cursor: pointer; }
        .script-card:hover { border-color: #a855f7; transform: translateY(-3px); }
        .script-img { width: 100%; height: 140px; background-size: cover; background-position: center; position: relative; }
        .stats-badge { position: absolute; top: 10px; right: 10px; background: rgba(5,2,10,0.8); color: #c084fc; font-size: 11px; padding: 2px 6px; border-radius: 4px; }
        
        .script-body { padding: 12px; }
        .script-title { font-weight: bold; color: #fff; font-size: 14px; margin-bottom: 5px; }

        .detail-page { display: none; }
        .detail-card { background: #0d051a; border: 1px solid #2e1065; border-radius: 12px; padding: 20px; margin-bottom: 20px; }
        .detail-header { display: flex; gap: 20px; flex-wrap: wrap; }
        .detail-img { width: 100%; max-width: 320px; height: 180px; border-radius: 8px; background-size: cover; background-position: center; border: 1px solid #3b0764; }
        
        .code-container { background: #05020a; border: 1px solid #2e1065; border-radius: 8px; padding: 15px; margin-top: 15px; }
        .code-box { font-family: monospace; color: #a855f7; font-size: 12px; word-break: break-all; white-space: pre-wrap; }

        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; color: #fff; font-weight: 600; margin-bottom: 6px; font-size: 13px; }
        .form-control { width: 100%; background: #05020a; border: 1px solid #2e1065; border-radius: 6px; padding: 10px; color: #fff; outline: none; }

        .comment-item { border-bottom: 1px solid #2e1065; padding: 10px 0; }
        .comment-user { font-weight: bold; color: #c084fc; font-size: 12px; }
        
        footer { text-align: center; padding: 20px; color: #64748b; border-top: 1px solid #2e1065; margin-top: 40px; font-size: 12px; }
    </style>
</head>
<body>

    <div class="overlay" id="overlay" onclick="closeSidebar()"></div>

    <!-- Login Modal -->
    <div class="login-modal" id="loginModal">
        <h2>Welcome Back</h2>
        <p>Choose an account to continue to S7 Scripte</p>
        
        <button class="social-btn" onclick="loginWith('Google')">
            <img src="https://www.gstatic.com/images/branding/product/1x/gsa_512dp.png" alt="Google">
            Sign in with Google
        </button>
        
        <button class="social-btn" onclick="loginWith('GitHub')">
            <img src="https://github.githubassets.com/favicons/favicon.png" alt="GitHub">
            Sign in with GitHub
        </button>
    </div>

    <!-- Sidebar -->
    <div class="sidebar" id="sidebar">
        <button class="sidebar-close" onclick="closeSidebar()">✕</button>
        <div class="sidebar-links">
            <a onclick="showHome(); closeSidebar();">Home</a>
            <a onclick="showUpload(); closeSidebar();">Upload Script</a>
            <a onclick="openApiModal(); closeSidebar();">API</a>
        </div>
    </div>

    <!-- Header -->
    <header>
        <div class="logo" onclick="showHome()">S7 Scripte</div>
        <div class="header-actions">
            <div id="userProfile" style="display:none; align-items: center; gap: 8px;">
                <button class="btn-auth" onclick="showProfile()" id="profileName">Profile</button>
                <button class="btn-neon" onclick="logout()">Logout</button>
            </div>
            <button class="btn-neon" onclick="showUpload()">Upload</button>
            <button class="menu-btn" onclick="openSidebar()">☰</button>
        </div>
    </header>

    <div class="container">
        <!-- HOME PAGE -->
        <div id="homePage">
            <div class="search-container">
                <input type="text" id="searchInput" placeholder="Search scripts..." onkeyup="searchScripts()">
                <button class="btn-neon" onclick="searchScripts()">Search</button>
            </div>
            <div style="margin-bottom: 15px;"><h2 style="color: #fff;">Top Rated Scripts</h2></div>
            <div class="script-grid" id="scriptGrid"></div>
        </div>

        <!-- PROFILE PAGE -->
        <div id="profilePage" class="detail-page">
            <button class="btn-auth" onclick="showHome()" style="margin-bottom: 15px;">← Back to Home</button>
            <div class="detail-card">
                <h2 style="color: #fff;" id="profileTitle">User Profile</h2>
                <p style="color: #94a3b8; margin-top: 5px;">Your uploaded scripts:</p>
            </div>
            <div class="script-grid" id="userScriptGrid"></div>
        </div>

        <!-- DETAIL PAGE -->
        <div id="detailPage" class="detail-page">
            <button class="btn-auth" onclick="showHome()" style="margin-bottom: 15px;">← Back to Home</button>
            
            <div class="detail-card">
                <div class="detail-header">
                    <div class="detail-img" id="detailImg"></div>
                    <div style="flex:1;">
                        <h1 id="detailTitle" style="color: #fff; font-size: 22px;"></h1>
                        <div id="detailMeta" style="color: #94a3b8; font-size: 12px; margin: 8px 0;"></div>
                        <div style="display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap;">
                            <button class="btn-neon" onclick="copyScriptCode()">Copy Script</button>
                            <button class="btn-auth" onclick="rateCurrentScript()">Rate (+1 Star)</button>
                            <button class="btn-auth" id="editBtn" style="display:none;" onclick="openEditMode()">Edit Script</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- EDIT FORM -->
            <div class="detail-card" id="editCard" style="display:none;">
                <h3 style="color:#fff; margin-bottom: 10px;">Edit Your Script</h3>
                <div class="form-group">
                    <label>Title</label>
                    <input type="text" id="editTitle" class="form-control">
                </div>
                <div class="form-group">
                    <label>Features</label>
                    <textarea id="editFeatures" class="form-control"></textarea>
                </div>
                <div class="form-group">
                    <label>Script Code</label>
                    <textarea id="editCode" class="form-control" style="font-family: monospace;"></textarea>
                </div>
                <button class="btn-neon" onclick="saveScriptEdit()">Save Changes</button>
            </div>

            <div class="detail-card">
                <h3 style="color:#fff; margin-bottom: 10px;">Features</h3>
                <p style="color:#94a3b8;" id="detailDesc"></p>
            </div>

            <div class="detail-card">
                <h3 style="color:#fff; margin-bottom: 10px;">Raw Script</h3>
                <div class="code-container"><div class="code-box" id="detailCode"></div></div>
            </div>

            <!-- COMMENTS -->
            <div class="detail-card">
                <h3 style="color:#fff; margin-bottom: 15px;">Comments</h3>
                <div class="form-group">
                    <input type="text" id="commentInput" class="form-control" placeholder="Write a comment...">
                </div>
                <button class="btn-auth" onclick="addComment()">Post Comment</button>
                <div id="commentsList" style="margin-top: 15px;"></div>
            </div>
        </div>

        <!-- UPLOAD PAGE -->
        <div id="uploadPage" class="detail-page">
            <button class="btn-auth" onclick="showHome()" style="margin-bottom: 15px;">← Back to Home</button>
            <div class="detail-card">
                <h2 style="color:#fff; text-align: center; margin-bottom: 20px;">Upload Script</h2>
                <form onsubmit="handleUpload(event)">
                    <div class="form-group"><label>Title</label><input type="text" id="upTitle" class="form-control" required></div>
                    <div class="form-group"><label>Game ID</label><input type="text" id="upGameId" class="form-control"></div>
                    <div class="form-group"><label>Thumbnail (Image File)</label><input type="file" id="upImageFile" class="form-control" accept="image/*" onchange="previewImage(event)"></div>
                    <div class="form-group"><label>Features</label><textarea id="upFeatures" class="form-control" required></textarea></div>
                    <div class="form-group"><label>Script Code</label><textarea id="upCode" class="form-control" style="font-family: monospace;" required></textarea></div>
                    <button type="submit" class="btn-neon" style="width: 100%; padding: 10px;">Upload</button>
                </form>
            </div>
        </div>
    </div>

    <footer>Developed by <b>S7 Scripte</b> | All Rights Reserved</footer>

    <script>
        let currentUser = JSON.parse(localStorage.getItem('s7_user')) || null;
        let allScripts = [];
        let currentScriptIndex = null;
        let uploadedImageBase64 = "";

        function checkAuth() {
            if (!currentUser) {
                document.getElementById('loginModal').style.display = 'block';
                document.getElementById('overlay').classList.add('active');
                document.getElementById('userProfile').style.display = 'none';
            } else {
                document.getElementById('loginModal').style.display = 'none';
                document.getElementById('overlay').classList.remove('active');
                document.getElementById('userProfile').style.display = 'flex';
                document.getElementById('profileName').innerText = `Profile (${currentUser.name})`;
            }
        }

        function loginWith(provider) {
            const userName = prompt(`Enter your ${provider} Username:`);
            if (userName && userName.trim() !== "") {
                currentUser = { name: userName.trim(), provider: provider };
                localStorage.setItem('s7_user', JSON.stringify(currentUser));
                checkAuth();
            }
        }

        function logout() {
            currentUser = null;
            localStorage.removeItem('s7_user');
            checkAuth();
            showHome();
        }

        function openSidebar() {
            document.getElementById('sidebar').classList.add('active');
            document.getElementById('overlay').classList.add('active');
        }

        function closeSidebar() {
            document.getElementById('sidebar').classList.remove('active');
            if (currentUser) {
                document.getElementById('overlay').classList.remove('active');
            }
        }

        function showHome() {
            hideAllPages();
            document.getElementById('homePage').style.display = 'block';
            fetchDatabase();
        }

        function showUpload() {
            if (!currentUser) { checkAuth(); return; }
            hideAllPages();
            document.getElementById('uploadPage').style.display = 'block';
        }

        function showProfile() {
            hideAllPages();
            document.getElementById('profilePage').style.display = 'block';
            document.getElementById('profileTitle').innerText = `${currentUser.name}'s Profile`;
            const userScripts = allScripts.filter(s => s.owner === currentUser.name);
            renderScripts(userScripts, 'userScriptGrid');
        }

        function hideAllPages() {
            document.getElementById('homePage').style.display = 'none';
            document.getElementById('detailPage').style.display = 'none';
            document.getElementById('uploadPage').style.display = 'none';
            document.getElementById('profilePage').style.display = 'none';
        }

        function previewImage(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (evt) => uploadedImageBase64 = evt.target.result;
                reader.readAsDataURL(file);
            }
        }

        async function fetchDatabase() {
            const localScripts = JSON.parse(localStorage.getItem('local_user_scripts') || '[]');
            let remoteScripts = [];
            try {
                const res = await fetch('https://raw.githubusercontent.com/aljshjjj-afk/S7script/main/database.json');
                if(res.ok) {
                    const data = await res.json();
                    remoteScripts = data.scripts || [];
                }
            } catch (err) {
                console.log("Using local data...");
            }
            
            // Combine all scripts so everyone can see all scripts
            allScripts = [...localScripts, ...remoteScripts];

            // Remove duplicates by title
            allScripts = allScripts.filter((v,i,a)=>a.findIndex(v2=>(v2.title===v.title))===i);

            // Sort by highest rating
            allScripts.sort((a, b) => (b.rating || 0) - (a.rating || 0));
            renderScripts(allScripts, 'scriptGrid');
        }

        function renderScripts(scripts, containerId) {
            const grid = document.getElementById(containerId);
            grid.innerHTML = '';
            if (!scripts || scripts.length === 0) { 
                grid.innerHTML = '<div style="color:#a855f7; grid-column: 1/-1; text-align:center;">No scripts available.</div>'; 
                return; 
            }

            scripts.forEach((s) => {
                const globalIndex = allScripts.indexOf(s);
                grid.innerHTML += `
                    <div class="script-card" onclick="openScriptDetails(${globalIndex})">
                        <div class="script-img" style="background-image: url('${s.thumbnail || 'https://via.placeholder.com/300x150'}');">
                            <span class="stats-badge">★ ${s.rating || 0} | 👁 ${s.views || 0}</span>
                        </div>
                        <div class="script-body">
                            <div class="script-title">${s.title}</div>
                            <p style="font-size: 11px; color: #64748b;">By: ${s.owner || 'Community'}</p>
                        </div>
                    </div>
                `;
            });
        }

        function openScriptDetails(index) {
            currentScriptIndex = index;
            const s = allScripts[index];
            s.views = (s.views || 0) + 1;
            saveLocalState();

            document.getElementById('detailTitle').innerText = s.title;
            document.getElementById('detailMeta').innerText = `Views: ${s.views} | Rating: ★ ${s.rating || 0} | Author: ${s.owner || 'Community'}`;
            document.getElementById('detailImg').style.backgroundImage = `url('${s.thumbnail || 'https://via.placeholder.com/300x150'}')`;
            document.getElementById('detailDesc').innerText = s.features || 'No features described.';
            document.getElementById('detailCode').innerText = s.script_code || '';

            const isOwner = currentUser && (currentUser.name === s.owner);
            document.getElementById('editBtn').style.display = isOwner ? 'inline-block' : 'none';
            document.getElementById('editCard').style.display = 'none';

            renderComments(s.comments || []);
            hideAllPages();
            document.getElementById('detailPage').style.display = 'block';
        }

        function rateCurrentScript() {
            if (currentScriptIndex === null) return;
            allScripts[currentScriptIndex].rating = (allScripts[currentScriptIndex].rating || 0) + 1;
            saveLocalState();
            openScriptDetails(currentScriptIndex);
        }

        function openEditMode() {
            const s = allScripts[currentScriptIndex];
            document.getElementById('editTitle').value = s.title;
            document.getElementById('editFeatures').value = s.features;
            document.getElementById('editCode').value = s.script_code;
            document.getElementById('editCard').style.display = 'block';
        }

        function saveScriptEdit() {
            const s = allScripts[currentScriptIndex];
            s.title = document.getElementById('editTitle').value;
            s.features = document.getElementById('editFeatures').value;
            s.script_code = document.getElementById('editCode').value;
            saveLocalState();
            alert('Script changes saved!');
            openScriptDetails(currentScriptIndex);
        }

        function addComment() {
            if (!currentUser) { alert('Please login to comment!'); return; }
            const input = document.getElementById('commentInput');
            if (!input.value.trim()) return;
            
            const s = allScripts[currentScriptIndex];
            if (!s.comments) s.comments = [];
            s.comments.push({ user: currentUser.name, text: input.value.trim() });
            saveLocalState();
            input.value = '';
            renderComments(s.comments);
        }

        function renderComments(comments) {
            const list = document.getElementById('commentsList');
            if(!comments || comments.length === 0) {
                list.innerHTML = '<div style="color:#64748b; font-size:12px;">No comments yet.</div>';
                return;
            }
            list.innerHTML = comments.map(c => `
                <div class="comment-item">
                    <div class="comment-user">${c.user}</div>
                    <div style="font-size:12px; color:#c9d1d9;">${c.text}</div>
                </div>
            `).join('');
        }

        function handleUpload(e) {
            e.preventDefault();
            if(!currentUser) { checkAuth(); return; }

            const newScript = {
                title: document.getElementById('upTitle').value,
                game_id: document.getElementById('upGameId').value || 'Universal',
                thumbnail: uploadedImageBase64 || 'https://via.placeholder.com/300x150',
                features: document.getElementById('upFeatures').value,
                script_code: document.getElementById('upCode').value,
                owner: currentUser.name,
                views: 0,
                rating: 0,
                comments: []
            };

            allScripts.unshift(newScript);
            saveLocalState();
            alert('Script uploaded successfully!');
            showHome();
        }

        function saveLocalState() {
            localStorage.setItem('local_user_scripts', JSON.stringify(allScripts));
        }

        function copyScriptCode() {
            if (currentScriptIndex === null) return;
            navigator.clipboard.writeText(allScripts[currentScriptIndex].script_code);
            alert('Script code copied!');
        }

        function openApiModal() {
            const apiUrl = 'https://raw.githubusercontent.com/aljshjjj-afk/S7script/main/database.json';
            navigator.clipboard.writeText(apiUrl);
            alert(`API Link copied to clipboard:\n${apiUrl}`);
        }

        function searchScripts() {
            const q = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allScripts.filter(s => s.title.toLowerCase().includes(q));
            renderScripts(filtered, 'scriptGrid');
        }

        // Initialize
        checkAuth();
        fetchDatabase();
    </script>
</body>
</html>
